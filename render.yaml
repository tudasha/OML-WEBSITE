services:
  - type: web
    name: oml-website
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://event-backend-u3jp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
